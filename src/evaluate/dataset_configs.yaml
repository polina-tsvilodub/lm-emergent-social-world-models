  context2:
    context: ["tb_story", "final_sentence_prefix"]
    correct: "tb_correct"
    incorrect: "fb_correct"
    condition: "epitome_fb_tb"

# Faux Pas EAI has four questions in the original paper, of which all four have to be correct to count the item as correct.
# This simplified version has only the two that are answered with “Yes” or “No”, i.e. Q1 and Q4, leaving out the open-ended Q2 and Q3.
# Q2 is about locating the faux pas in the string and is difficult for some LMs because they misidentify a quote
# even in the control condition, where the correct answer is “Nothing”, i.e., by being mislead by a wrong presupposition.
# Q3 is a general text understanding question to check whether the context is understood. This means that of the two
# questions not represented here, one is a general control question that does not directly concern faux pas or ToM (Q3),
# and one concerns faux pas but is mostly failed for other reasons.
# There are evaluation methods from the original paper (including for Q2 and Q3) at
# https://github.com/natalieShapira/FauxPasEAI/blob/main/Code%20and%20Data/FauxPasEvaluation.py, which rely on string
# overlap between the gold standard reference and the generated answer rather than logprobs.

fauxpas_eai_q1_and_q4:
  context1:
    context: ["story", "question_1"]
    correct: "correct_1"
    incorrect: "incorrect_1"
    condition: "fauxpas_eai_q1"
    answer_prefix: " The answer is: "
  context2:
    context: ["story", "question_4"]
    correct: "correct_4"
    incorrect: "incorrect_4"
    condition: "fauxpas_eai_q4"
    answer_prefix: " The answer is: "

