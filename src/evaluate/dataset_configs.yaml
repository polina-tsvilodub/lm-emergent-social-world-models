    incorrect: "tb_correct_continuation"
    condition: "bigtom_fb"
  context2:
    context: ["story", "tb_trigger", "final_sentence_prefix"]
    correct: "tb_correct_continuation"
    incorrect: "fb_correct_continuation"
    condition: "bigtom_tb"

